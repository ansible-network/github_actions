[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Minimal packaging so this repository can be consumed as a pre-commit hook
# repository (see .pre-commit-hooks.yaml). pre-commit builds a virtualenv from
# this metadata, which is how the hooks get their dependencies -- `language:
# script` could not install pyyaml for update_aws_user_agent.
[project]
name = "ansible-network-github-actions"
version = "1.0.0"
description = "Helper scripts for ansible-network collection CI, exposed as pre-commit hooks"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[project.scripts]
update-aws-user-agent = "update_aws_user_agent:main"
update-aws-boto-constraints = "update_aws_boto_constraints:main"

[tool.setuptools]
# scripts/ contains standalone top-level modules, not a package.
py-modules = ["update_aws_user_agent", "update_aws_boto_constraints"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool]

[tool.black]
line-length = 100

[tool.isort]
force_single_line = true # Force from .. import to be 1 per line, minimizing changes at time of implementation
lines_after_imports = 2 # Ensures consistency for cases when there's variable vs function/class definitions after imports
lines_between_types = 1 # Separate import/from with 1 line, minimizing changes at time of implementation
no_lines_before = "LOCALFOLDER" # Keeps local imports bundled with first-party
profile = "black" # Avoid conflict with black

[tool.pylint]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.master]
no-docstring-rgx = "__.*__"

[tool.pylint.messages_control]
disable = ["fixme"]
enable = [
  "useless-suppression", # Identify unneeded pylint disable statements

]
